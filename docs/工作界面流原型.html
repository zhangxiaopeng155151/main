<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 小说生成器 · 工作界面流原型</title>
<style>
  :root{
    --bg:#f5f6fa; --panel:#ffffff; --panel-2:#fbfbfe; --line:#e5e7f0; --line-2:#eef0f7;
    --text:#171a23; --muted:#6b7280; --muted-2:#9aa1b1;
    --primary:#4f6ef7; --primary-2:#7c93ff; --primary-weak:#eef1ff; --primary-line:#d7deff;
    --ok:#12a874; --ok-weak:#e7f7f0; --warn:#c9791a; --warn-weak:#fdf3e3; --danger:#dc2626; --danger-weak:#fdecec;
    --radius:14px; --shadow:0 1px 2px rgba(23,26,35,.06),0 8px 24px rgba(23,26,35,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
       color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,textarea{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:232px 1fr;height:100vh;overflow:hidden}

  /* ---------- sidebar ---------- */
  .side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;gap:10px;align-items:center;padding:16px 16px 12px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#8f6df7);
        display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
  .brand b{font-size:14px;letter-spacing:.2px}
  .brand small{display:block;color:var(--muted-2);font-size:11px;font-weight:400}
  .side-scroll{overflow:auto;padding:6px 10px 14px;flex:1;min-height:0}
  .nav-group{margin:10px 0 4px;padding:0 8px;color:var(--muted-2);font-size:11px;letter-spacing:.08em}
  .nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:10px;color:#3b4256;
            text-align:left;font-size:13.5px;transition:.15s}
  .nav-item:hover{background:var(--panel-2)}
  .nav-item.on{background:var(--primary-weak);color:#2b3bb0;font-weight:600;box-shadow:inset 0 0 0 1px var(--primary-line)}
  .nav-item .ic{width:18px;text-align:center;opacity:.85;font-size:14px}
  .nav-item .badge{margin-left:auto;font-size:10.5px;padding:1px 6px;border-radius:20px;background:var(--panel-2);
                   color:var(--muted);border:1px solid var(--line)}
  .nav-item.on .badge{background:#fff;border-color:var(--primary-line);color:#2b3bb0}
  .side-foot{border-top:1px solid var(--line);padding:10px;display:grid;gap:6px}

  /* ---------- main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .top{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px 10px}
  .top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .book{display:flex;align-items:center;gap:10px;min-width:0}
  .cover{width:34px;height:46px;border-radius:6px;background:linear-gradient(150deg,#2f4a8a,#5d7fd6 60%,#8fb4e8);
         box-shadow:var(--shadow);flex:0 0 auto}
  .book h1{margin:0;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book p{margin:0;color:var(--muted);font-size:12px}
  .spacer{flex:1}
  .btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13px;
       transition:.15s;white-space:nowrap}
  .btn:hover{border-color:#d3d8e8;background:var(--panel-2)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;
               box-shadow:0 2px 8px rgba(79,110,247,.28)}
  .btn.primary:hover{background:#4460e6}
  .btn.ghost{background:transparent}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
  .progress{margin-top:12px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel-2);padding:10px 12px}
  .phases{display:flex;gap:6px;flex-wrap:wrap}
  .phase{flex:1 1 130px;min-width:0;padding:7px 10px;border-radius:9px;background:#fff;border:1px solid var(--line-2);
         font-size:12px;color:var(--muted);position:relative}
  .phase b{display:block;font-size:12.5px;color:#39405a;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phase.done{background:var(--ok-weak);border-color:#cdeee1;color:#0e8a5f}
  .phase.done b{color:#0e8a5f}
  .phase.current{background:var(--primary-weak);border-color:var(--primary-line);color:#3a49b8;box-shadow:0 0 0 2px #eaefff}
  .phase.current b{color:#2b3bb0}
  .next{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13px;flex-wrap:wrap}
  .next .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--primary-weak)}

  .content{flex:1;min-height:0;overflow:auto;padding:18px 20px 26px}
  .api-note{margin-top:14px;padding:8px 12px;border-radius:10px;background:#f0f2fb;border:1px dashed #ccd5f7;
            color:#4a5480;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}

  /* ---------- generic ---------- */
  .grid{display:grid;gap:14px}
  .cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
  @media(max-width:1100px){.cols-3,.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line-2)}
  .card-h h3{margin:0;font-size:13.5px;font-weight:650}
  .card-h .sub{color:var(--muted);font-size:12px;font-weight:400}
  .card-b{padding:14px 15px}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:1.5px 8px;border-radius:20px;font-size:11.5px;
       background:var(--primary-weak);color:#33429e;border:1px solid var(--primary-line)}
  .tag.ok{background:var(--ok-weak);color:#0e8a5f;border-color:#cdeee1}
  .tag.warn{background:var(--warn-weak);color:#9a6212;border-color:#f3dcc0}
  .tag.gray{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
  .muted{color:var(--muted)}
  .kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:13px}
  .kv dt{color:var(--muted);font-size:12.5px}
  .kv dd{margin:0}
  .field{display:block;margin-bottom:10px}
  .field span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
  .field input,.field textarea,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);
       border-radius:9px;background:#fff;outline:none;transition:.15s}
  .field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
  .field textarea{resize:vertical;min-height:64px;line-height:1.7}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tabs{display:flex;gap:4px;padding:4px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;width:max-content;max-width:100%;overflow:auto}
  .tab{padding:5px 12px;border-radius:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .tab.on{background:#fff;color:#2b3bb0;font-weight:600;box-shadow:0 1px 3px rgba(23,26,35,.1)}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .stat b{display:block;font-size:20px;line-height:1.25;letter-spacing:-.01em}
  .stat span{color:var(--muted);font-size:12px}
  .empty{padding:26px;text-align:center;color:var(--muted-2);font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:7px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:600;
          background:var(--primary-weak);color:#33429e;flex:0 0 auto}
  .stack{display:flex;flex-direction:column;gap:12px}
  .hint{font-size:12px;color:var(--muted)}
  .dotline{border-left:2px dotted var(--primary-line);margin-left:8px;padding-left:14px}
  .tree-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:13px}
  .tree-item:hover{background:var(--panel-2)}
  .tree-item.on{background:var(--primary-weak);color:#2b3bb0;font-weight:600}

  /* ---------- bookshelf ---------- */
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
  .book-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
             box-shadow:var(--shadow);transition:.18s}
  .book-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(23,26,35,.12)}
  .book-card .art{height:86px;background:linear-gradient(150deg,#2f4a8a,#5d7fd6 55%,#a9c6ee);position:relative;padding:10px 12px;color:#fff}
  .book-card .art b{font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.25)}
  .book-card .art em{position:absolute;right:10px;bottom:8px;font-style:normal;font-size:11px;opacity:.85}
  .book-card .meta{padding:10px 12px;display:grid;gap:6px}
  .bar{height:5px;border-radius:6px;background:var(--line-2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),var(--primary-2))}

  /* ---------- chapter editor ---------- */
  .editor{display:grid;grid-template-columns:214px minmax(0,1fr) 286px;gap:14px;min-height:0}
  @media(max-width:1180px){.editor{grid-template-columns:1fr}}
  .editor-paper{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
                display:flex;flex-direction:column;min-height:520px}
  .paper-head{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
  .paper-body{padding:22px 26px;font-size:15px;line-height:1.95;letter-spacing:.01em;flex:1;outline:none}
  .paper-body p{margin:0 0 1em}
  .paper-foot{display:flex;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--line-2);
              color:var(--muted);font-size:12px;flex-wrap:wrap}

  /* ---------- graph ---------- */
  .graph{position:relative;height:430px;background:
      radial-gradient(circle at 30% 20%,#f4f6ff,transparent 60%),radial-gradient(circle at 75% 75%,#f2fbf7,transparent 55%),#fdfdfe;
      border-radius:12px;border:1px solid var(--line-2);overflow:hidden}
  .graph svg{width:100%;height:100%;display:block}
  .gnode{cursor:pointer}
  .gnode text{font-size:11.5px;fill:#2b3040;pointer-events:none}

  /* ---------- drawer / modal / toast ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,24,36,.36);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;background:var(--panel);
          box-shadow:-12px 0 40px rgba(23,26,35,.16);transform:translateX(102%);transition:transform .24s cubic-bezier(.2,.7,.3,1);
          z-index:50;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .drawer-h b{font-size:14px}
  .drawer-b{flex:1;overflow:auto;padding:14px 16px}
  .drawer-f{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap}
  .step{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:13px;color:var(--muted)}
  .step i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
          font-size:9px;font-style:normal;flex:0 0 auto;margin-top:3px}
  .step.run{color:#2b3bb0}
  .step.run i{border-color:var(--primary);border-right-color:transparent;animation:spin .8s linear infinite}
  .step.ok{color:#0e8a5f}
  .step.ok i{border-color:var(--ok);background:var(--ok);color:#fff}
  @keyframes spin{to{transform:rotate(360deg)}}
  .modal{position:fixed;inset:0;display:grid;place-items:center;z-index:60;opacity:0;pointer-events:none;transition:.2s;padding:24px}
  .modal.on{opacity:1;pointer-events:auto}
  .modal-card{background:var(--panel);border-radius:16px;max-width:900px;width:100%;max-height:88vh;overflow:auto;
              box-shadow:0 24px 60px rgba(16,20,32,.28)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#171a23;color:#fff;
         padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:70;
         box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:80vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .flowline{display:flex;align-items:stretch;gap:10px;overflow:auto;padding:4px}
  .fbox{min-width:150px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--panel-2);font-size:12.5px}
  .fbox b{display:block;font-size:12.5px;color:#2b3bb0;margin-bottom:2px}
  .fbox small{color:var(--muted);font-size:11px}
  .farrow{display:grid;place-items:center;color:var(--muted-2);font-size:16px}
  .pill{font-size:11px;padding:1px 7px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">墨</div>
      <div><b>AI 小说生成器</b><small>工作界面流 · 原型</small></div>
    </div>
    <div class="side-scroll" id="nav"></div>
    <div class="side-foot">
      <button class="btn ghost sm" data-action="flowmap">🗺 流程地图</button>
      <button class="btn ghost sm" data-action="note">ℹ 说明：哪些是真的</button>
    </div>
  </aside>

  <div class="main">
    <div class="top" id="top"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="scrim" id="scrim" data-action="close-drawer"></div>

<aside class="drawer" id="drawer">
  <div class="drawer-h">
    <b id="drawer-title">AI 生成</b>
    <span class="tag gray" id="drawer-tag">候选</span>
    <button class="btn sm" style="margin-left:auto" data-action="close-drawer">关闭</button>
  </div>
  <div class="drawer-b" id="drawer-body"></div>
  <div class="drawer-f" id="drawer-foot"></div>
</aside>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="drawer-h" style="border-bottom:1px solid var(--line)">
      <b id="modal-title">流程地图</b>
      <button class="btn sm" style="margin-left:auto" data-action="close-modal">关闭</button>
    </div>
    <div style="padding:16px 18px" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   数据：全部取自项目真实字段/文案结构，内容为演示用虚构小说
   ============================================================ */
const NOVEL = {
  title: "潮汐档案", subtitle: "第一卷 · 咸水记忆", genre: "悬疑 / 都市奇幻",
  tags: ["记忆", "填海城市", "档案", "失踪"],
  tone: "冷静、潮湿、克制的悬疑", target_audience: "成年读者",
  core_idea: "在一个能听见潮汐记忆的填海城市，档案管理员追查失踪的姐姐，发现整座城市的记忆都被系统性篡改。",
  core_seed: "记忆可以寄存于潮汐介质，誊抄即失真。",
  worldview: "填海城「潮汐市」建于旧海湾之上，海水退去后残留的潮声会记录发生过的事。档案局用「潮汐档案匣」保存这些记忆，但任何誊抄都会让原件失去权重。",
  writing_style: "第三人称限知，短句为主，重视环境声与水体意象。",
  narrative_pov: "第三人称 · 单视角（林砚）", era_background: "近未来 · 填海完成后的第九年",
  number_of_chapters: 20, words_per_chapter: 2600,
  introduction: "林砚在档案局旧库听见了姐姐的声音——但她已经失踪三年，且官方档案里从未记录过这个人。"
};

const PHASES = ["建立作品", "开场资料", "本卷剧情", "本卷准备", "本卷章节", "继续规划"];

const FACTIONS = [
  { name: "潮汐档案馆", type: "城市机构", stance: "公开：保管潮声记忆", goal: "维持记忆归档秩序", hidden: "掩盖旧海湾拆迁档案", tags: ["官方", "林砚所属"], level: "核心", id: "f1" },
  { name: "填海工事局", type: "政府部门", stance: "公开：推进填海二期", goal: "在年底前完成七号闸合拢", hidden: "清理旧海湾住户记录", tags: ["官方", "对立"], level: "核心", id: "f2" },
  { name: "拾忆会", type: "地下组织", stance: "公开：无", goal: "保存被删改的原始记忆", hidden: "掌握一批未被誊抄的潮声原件", tags: ["地下", "亦敌亦友"], level: "次级", id: "f3" }
];

const CHARACTERS = [
  { name: "林砚", role: "主角 · 档案管理员", imp: "核心", desire: "找到姐姐失踪的真相", fear: "自己也是被改写过的记忆", tags: ["限知视角"], bind: "潮汐档案馆 · 编目员", id: "c1" },
  { name: "林澈", role: "关键人物 · 失踪者", imp: "核心", desire: "留下一份不会被誊抄的证词", fear: "被彻底忘记", tags: ["姐姐", "失踪三年"], bind: "曾属工事局 · 测绘员", id: "c2" },
  { name: "陆昀", role: "对手/协助者", imp: "重要", desire: "查清七号闸的沉降事故", fear: "重演九年前的溃堤", tags: ["工事局调查员"], bind: "填海工事局 · 调查员", id: "c3" },
  { name: "阿井", role: "配角", imp: "次要", desire: "把手里的原件卖个好价", fear: "被拾忆会清理", tags: ["黑市中间人"], bind: "拾忆会 · 外围", id: "c4" }
];

const RELATIONS = [
  { a: "林砚", b: "林澈", type: "姐妹", state: "失联 · 仍在寻找", intensity: 5, kind: "设计" },
  { a: "林砚", b: "陆昀", type: "旧识 → 互相试探", state: "合作但隐瞒", intensity: 3, kind: "事实" },
  { a: "陆昀", b: "填海工事局", type: "隶属", state: "表面服从", intensity: 3, kind: "设计" },
  { a: "林砚", b: "拾忆会", type: "交易关系", state: "通过阿井接触", intensity: 2, kind: "事实" }
];

const RULES = [
  { name: "潮声记忆不可转述", cat: "世界法则", statement: "潮声记录只能被直接聆听；任何转述都会让听者得到失真版本。", scope: "全域", priority: "高" },
  { name: "档案匣认人", cat: "器物规则", statement: "档案匣只对最初录入者或其血亲开放，强行打开会触发海水灌注。", scope: "档案局 · 器物", priority: "高" },
  { name: "填海期禁航", cat: "社会规则", statement: "二期工事期间，旧海湾水面禁止任何民间船只通行。", scope: "七号闸周边", priority: "中" }
];

const ITEMS = [

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const { action } = el.dataset;
  const go = (ws) => { state.view = "writing"; state.ws = ws; render(); };

  if (action === "shelf") { state.view = "bookshelf"; render(); return; }
  if (action === "open-book") { state.view = "writing"; state.ws = "novel-info"; render(); return; }
  if (action === "new-novel") { state.view = "new"; state.newStep = 0; render(); return; }
  if (action === "ws") { go(el.dataset.ws); return; }
  if (action === "tab") { state.tab[el.dataset.scope] = el.dataset.tab; render(); return; }
  if (action === "pick-volume") { state.activeVolume = el.dataset.id; render(); return; }
  if (action === "pick-arc") { state.activeArc = el.dataset.id; render(); return; }
  if (action === "open-chapter") { state.activeChapter = el.dataset.id; state.activeArc = "a1"; go("chapter-editor"); return; }
  if (action === "gnode") { state.graphNode = el.dataset.id; render(); return; }
  if (action === "flowmap") { flowMap(); return; }
  if (action === "note") { noteModal(); return; }
  if (action === "close-modal") { $("#modal").classList.remove("on"); return; }
  if (action === "close-drawer") { closeDrawer(); return; }
  if (action === "gen") { openDrawer(el.dataset.kind); return; }
  if (action === "adopt-gen") {
    const k = state.drawer && state.drawer.kind; closeDrawer();
    if (k === "write") {
      const ch = state.chapters.find(c => c.id === state.activeChapter);
      if (ch) { ch.draft = CHAPTER_TEXT.concat(["她从口袋里摸出听针，铜面上有第二道细纹。"]); ch.words = 2610; }
      render(); toast("正文候选已采用并保存（版本 +1）");
    } else {
      state.phase = Math.max(state.phase, 2); render(); toast("候选已保存，资料变更已广播刷新");
    }
    return;
  }
  if (action === "toast") { toast(el.dataset.msg || "已执行"); return; }
  if (action === "next-step") {
    const map = { 0: "novel-info", 1: "faction-cards", 2: "volume-planning", 3: "volume-planning", 4: "chapter-editor", 5: "chapter-records" };
    go(map[state.phase] || "chapter-editor");
    toast("已按「保存的事实」跳到下一步：" + nextStepTitle());
    return;
  }
  if (action === "skip-optional") { state.phase = 2; render(); toast("已记录跳过（仅本地），进度进入本卷剧情"); return; }
  if (action === "run-steps") {
    state.newStep = Math.min(4, (state.newStep || 0) + 1); render();
    toast(state.newStep >= 4 ? "四步全部完成，可以保存并创建小说" : "步骤完成（可重试）");
    return;
  }
  if (action === "save-novel") { state.view = "writing"; state.ws = "novel-info"; state.phase = 1; render(); toast("小说创建成功，进入写作台"); return; }
  if (action === "save-chapter") {
    const paper = $("#paper"); const ch = state.chapters.find(c => c.id === state.activeChapter);
    if (paper && ch) { ch.draft = paper.innerText.split(/\n+/).filter(Boolean); ch.words = wordCount(paper.innerText); }
    render(); toast("已保存正文（版本 +1，草稿标记清除）"); return;
  }
  if (action === "continue") { toast("续写：以上文最后 800 字为上下文，流式追加"); return; }
  if (action === "check") { toast("已运行「" + el.dataset.kind + "」检查，结果进入章后记录"); return; }
  if (action === "adopt") { state.records[+el.dataset.i].state = "已采用"; render(); toast("已写入事实历史（before/after + 证据）"); return; }
  if (action === "void-record") { state.records[+el.dataset.i].state = "已作废"; render(); toast("已作废，保留记录与原因"); return; }
  if (action === "assistant-apply") { toast("已应用 2 处改动（可 undo）"); return; }
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeDrawer(); $("#modal").classList.remove("on"); } });

render();
</script>
</body>
</html>
